spring:
  application:
    name: outreach-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/outreach}
    username: ${DB_USER:outreach}
    password: ${DB_PASSWORD:outreach}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}

outreach:
  scheduler:
    enabled: true
    interval-ms: 60000
    batch-size: 50
  sending:
    provider: smtp
    default-from-name: ${FROM_NAME:Outreach Demo}
    default-from-email: ${FROM_EMAIL:hello@localhost}
    unsubscribe-base-url: ${UNSUBSCRIBE_BASE_URL:http://localhost:8080/u}
    physical-address: ${PHYSICAL_ADDRESS:123 Example St, Columbia, MO 65201}
  personalization:
    # "template" = plain placeholders, no network. "anthropic" = LLM-written opener.
    provider: ${PERSONALIZATION_PROVIDER:template}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
      max-tokens: 200
      read-timeout: 20s

logging:
  level:
    com.rushil.outreach: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000